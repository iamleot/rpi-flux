---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      version: 88.5.3
  install:
    crds: Create
    createNamespace: true
  interval: 10m0s
  releaseName: kube-prometheus-stack
  storageNamespace: prometheus
  targetNamespace: prometheus
  upgrade:
    crds: CreateReplace
  # XXX: Double-check the order of the targetPath defined here and in
  # XXX: spec.valuesFrom!
  valuesFrom:
    - kind: Secret
      name: slack-api-url
      valuesKey: slack_api_url
      targetPath: alertmanager.config.global.slack_api_url
    - kind: Secret
      name: discord-webhook-url
      valuesKey: discord_webhook_url
      targetPath: alertmanager.config.receivers[1].discord_configs[0].webhook_url
    - kind: Secret
      name: telegram-bot
      valuesKey: bot_token
      targetPath: alertmanager.config.receivers[3].telegram_configs[0].bot_token
    - kind: Secret
      name: telegram-bot
      valuesKey: chat_id
      targetPath: alertmanager.config.receivers[3].telegram_configs[0].chat_id
  values:
    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            memory: 32Mi
      networkPolicy:
        enabled: true
        egress:
          enabled: true
      config:
        route:
          group_by: ['namespace']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: 'null'
          routes:
            - receiver: 'null'
              matchers:
                - alertname =~ "InfoInhibitor|Watchdog"
            - receiver: 'discord'
              continue: true
            - receiver: 'slack'
              continue: true
            - receiver: 'telegram'
              continue: true
        # XXX: Double-check the order of the receivers defined here and in
        # XXX: spec.valuesFrom!
        receivers:
          - name: 'null'
          - name: 'discord'
            discord_configs:
              - send_resolved: true
                title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}{{ if .CommonLabels.job }} for {{ .CommonLabels.job }}{{end}}'
                message: |-
                  {{ range .Alerts }}
                    **Alert:** {{ .Annotations.summary }} - `{{ .Labels.severity }}`
                    **Description:** {{ .Annotations.description }}
                    **Status:** {{ .Status }}
                    **Details:**
                    {{ range .Labels.SortedPairs }} • **{{ .Name }}:** `{{ .Value }}`
                    {{ end }}
                  {{ end }}
          - name: 'slack'
            slack_configs:
              - send_resolved: true
                channel: '#rpi-alerts'
                title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}{{ if .CommonLabels.job }} for {{ .CommonLabels.job }}{{end}}'
                text: |-
                  {{ range .Alerts }}
                    *Alert:* {{ .Annotations.summary }} - `{{ .Labels.severity }}`
                    *Description:* {{ .Annotations.description }}
                    *Status:* {{ .Status }}
                    *Details:*
                    {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
                    {{ end }}
                  {{ end }}
          - name: 'telegram'
            telegram_configs:
              - send_resolved: true
                message: |-
                  [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}{{ if .CommonLabels.job }} for {{ .CommonLabels.job }}{{end}}
                  {{ range .Alerts }}
                    Alert: {{ .Annotations.summary }} - {{ .Labels.severity }}
                    Description: {{ .Annotations.description }}
                    Status: {{ .Status }}
                    Details:
                    {{ range .Labels.SortedPairs }} • {{ .Name }}: {{ .Value }}
                    {{ end }}
                  {{ end }}
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeScheduler: false
    grafana:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    prometheus:
      networkPolicy:
        enabled: true
        egress:
          - to:
              - namespaceSelector:
                  matchExpressions:
                    - key: namespace
                      operator: In
                      values:
                        - kube-system
                podSelector:
                  matchLabels:
                    k8s-app: coredns
              - namespaceSelector:
                  matchExpressions:
                    - key: namespace
                      operator: In
                      values:
                        - victorialogs
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: victoria-logs-collector
              - namespaceSelector:
                  matchExpressions:
                    - key: namespace
                      operator: In
                      values:
                        - victorialogs
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: victoria-logs-single
            ports:
              - port: 9153  # coredns
              - port: 9428  # victoria-logs-single
              - port: 9429  # victoria-logs-collector
      prometheusSpec:
        retention: 7d
        storageSpec:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 10Gi
    prometheusOperator:
      networkPolicy:
        enabled: true
